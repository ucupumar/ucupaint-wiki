site_name: Ucupaint
site_description : Ucupaint is Blender addon to manage texture as layers for Eevee and Cycles renderer.
theme: 
  name : readthedocs
  icon:
    admonition:
      <type>: <icon>
nav:
  - Documentation :
    - Quick Setup : quick_setup.md
    - Channel : channel.md 
    - Layer : layer.md
    - Layer Channel : layer_channel.md
    - Mask : mask.md
    - Modifier : modifier.md
    - Preview Mode : preview_mode.md
    - Bake as Layer/Mask : bake_as_entity.md
    - Transfer UV : transfer_uv.md
    - Baking Ucupaint Node : bake_target.md
    - Preferences : preferences.md
  - Export-Import Layers:
    - PSD: psd_io.md
  - Resources :
    - File Examples : sample_files.md
    - Video Tutorials : video-tutorials.md
    - Written Tutorials : text-tutorials.md
  - Tips & Troubleshooting :
    - Performance Tips: tips.md
    - Pink Material: pink_material.md
  - Development :
    - Roadmaps : roadmaps.md
    - Credits : contributors.md
extra_css:
  - css/extra.css
plugins:
  - search
  - mkdocs-video:
      is_video: True
      video_muted: True
      video_controls: True
      css_style:
        width: "100%"           
        max-width: "800px"      
        height: "auto"         
        display: "block"
        margin: "auto"
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - tables
