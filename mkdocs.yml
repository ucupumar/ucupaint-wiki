site_name: UCUPAINT
site_description : Ucupaint is Blender addon to manage texture as layers for Eevee and Cycles renderer.
theme: 
  name : readthedocs
  custom_dir: theme
  locale: en
  icon:
    admonition:
      <type>: <icon>
nav:
  - Documentation :
    - Quick Setup : 01.00.quick-setup.md
    - Channel : 01.01.channel.md 
    - Layer : 01.02.layer.md
    - Layer Channel : 01.03.layer-channel.md
    - Mask : 01.04.mask.md
    - Modifier : 01.05.modifier.md
    - Preview Mode : 01.06.preview-mode.md
    - Bake to Layer : 01.07.bake-to-layer.md
    - Transfer UV : 01.08.transfer-uv.md
    - Bake Channels : 01.09.bake-channels.md
  - Export-Import Layers:
    - PSD: psd-export-import.md
  - Resources :
    - File Examples : 01.10.resources.md
    - Video Tutorials : video-tutorials.md
    - Written Tutorials : text-tutorials.md
  - Tips & Troubleshooting :
    - Performance Tips: tips.md
    - Pink Material: 01.11.extras.md
  - Development :
    - Roadmaps : roadmaps.md
    - Credits : 01.12.contributors.md
extra_css:
  - css/extra.css
plugins:
  - search
  - mkdocs-video:
      is_video: True
      video_muted: True
      video_controls: True
      css_style:
        width: "100%"           
        max-width: "800px"      
        height: "auto"         
        display: "block"
        margin: "auto"
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          theme:
            locale: zh_CN
          nav_translations:
            Documentation: 文档
            Quick Setup: 快速设置
            Channel: 通道
            Layer: 图层
            Layer Channel: 图层通道
            Mask: 遮罩
            Modifier: 修改器
            Preview Mode: 预览模式
            Bake to Layer: 烘焙到图层
            Transfer UV: 传递 UV
            Bake Channels: 烘焙通道
            Export-Import Layers: 导出与导入图层
            Resources: 资源
            File Examples: 文件示例
            Video Tutorials: 视频教程
            Written Tutorials: 文字教程
            Tips & Troubleshooting: 提示与故障排除
            Performance Tips: 性能提示
            Pink Material: 粉色材质
            Development: 开发
            Roadmaps: 路线图
            Credits: 致谢
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - tables
